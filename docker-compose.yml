services:
  smerge:
    image: z0rr0/smerge:latest
    container_name: smerge
    user: "1000:1000"
    ports:
      - "43210:43210"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
    # the port must match "port" in data/config.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:43210/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    logging:
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          memory: 32m
